name: Main CI/CD Pipeline
run-name: ${{ github.actor }} triggered CI/CD on ${{ github.ref_name }}

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:

  call-docker-build:
    permissions:
      contents: read
    uses: ycpss91255-docker/base/.github/workflows/build-worker.yaml@v0.27.0-rc1
    with:
      image_name: gemini_cli
      build_runtime: false

  call-release:
    needs: call-docker-build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: ycpss91255-docker/base/.github/workflows/release-worker.yaml@v0.27.0-rc1
    with:
      archive_name_prefix: gemini_cli
    secrets: inherit
